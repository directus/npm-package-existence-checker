version: 2
updates:
  # npm
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Etc/UTC'
    labels:
      - 'Dependency'
    groups:
      production-dependencies:
        dependency-type: 'production'
        patterns:
          - '*'
      dev-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
    commit-message:
      prefix: 'deps'
      include: 'scope'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Etc/UTC'
    labels:
      - 'Dependency'
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'deps(actions)'
      include: 'scope'
